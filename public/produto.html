<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Conheça os detalhes dos produtos da Wesllen Imports e personalize sua camisa.">
  <title>Produto | Wesllen Imports</title>
  <link rel="icon" type="image/png" href="/assets/logo-wesllen-oficial.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/shop.css">
  <link rel="stylesheet" href="/brand.css">
</head>
<body data-page="produto">
  <div class="site-frame">
    <div id="shop-header"></div>
    <main class="shop-main product-main" id="product-page-main">
      <nav class="shop-breadcrumb" aria-label="Caminho"><a href="/">Início</a><span>›</span><a href="/catalogo">Catálogo</a><span>›</span><span id="breadcrumb-product">Produto</span></nav>
      <div id="product-page"><div class="shop-loading">Carregando produto...</div></div>
    </main>
    <div id="shop-footer"></div>
  </div>
  <div id="shop-overlay" class="shop-overlay" hidden></div>
  <aside id="shop-cart" class="shop-cart" role="dialog" aria-modal="true" aria-labelledby="shop-cart-title" hidden></aside>
  <div id="shop-toast" class="shop-toast" role="status" aria-live="polite"></div>
  <script type="module" src="/shop.js"></script>
</body>
</html>
